<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// === DAILY TRAVEL 
const SUPABASE_URL = "***";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFqZmZ5Ym9ja2F3cGZwdmFucHp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzMzIwNDQsImV4cCI6MjEwODkwODA0NH0.GIOHGMbKaXcwTxiHkhAOir171Wja8bDUChONACqo328";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const SUPABASE_READY = true;
console.log("Supabase connected to", SUPABASE_URL);

// Platform settings cache
let PLATFORM_SETTINGS_CACHE = {registration_fee:50000, commission_percent:5, admin_mtn_code:'', admin_airtel_code:'', mtn_fee_percent:1.5, airtel_fee_percent:1.5};

async function fetchPlatformSettings() {
  try {
    const {data, error} = await supabaseClient.from('platform_settings').select('*').eq('id',1).single();
    if(data) {
      PLATFORM_SETTINGS_CACHE = {
        registration_fee: data.registration_fee,
        commission_percent: data.commission_percent,
        admin_mtn_code: data.admin_mtn_code,
        admin_airtel_code: data.admin_airtel_code,
        mtn_fee_percent: data.mtn_fee_percent || 1.5,
        airtel_fee_percent: data.airtel_fee_percent || 1.5,
        support_phone: data.support_phone,
        support_manager: data.support_manager,
        support_email: data.support_email
      };
      return PLATFORM_SETTINGS_CACHE;
    }
  } catch(e){ console.log("Settings fetch fallback", e) }
  return PLATFORM_SETTINGS_CACHE;
}

// Real-time disbursement calculation - FINAL PRICE ONLY SHOWN TO CUSTOMER
function calculateFinalTicketPrice(basePrice, commissionPercent, mtnFeePercent) {
  const adminCommission = Math.round(basePrice * (commissionPercent/100));
  const providerFee = Math.round(basePrice * ((mtnFeePercent||1.5)/100));
  const finalPrice = basePrice + adminCommission + providerFee;
  return {
    finalPrice, // ONLY this shown to customer
    basePrice, // company gets this
    adminCommission, // admin gets this
    providerFee, // MTN/Airtel fee
    companyAmount: basePrice
  };
}

// Seat block sync
async function syncSeatBlock(scheduleId, seatNumber, companyId, action='block') {
  if(!SUPABASE_READY) return;
  if(action==='block') {
    const {error} = await supabaseClient.from('seat_blocks').insert({schedule_id:scheduleId, seat_number:seatNumber, blocked_by_company_id:companyId, reason:'offline_sale'});
    if(error) console.error(error);
  } else {
    await supabaseClient.from('seat_blocks').delete().eq('schedule_id', scheduleId).eq('seat_number', seatNumber);
  }
}

async function fetchSeatBlocks(scheduleId) {
  try {
    const {data} = await supabaseClient.from('seat_blocks').select('*').eq('schedule_id', scheduleId);
    return data || [];
  } catch(e){ return []; }
}

// Payment simulation with real split logic
async function processRegistrationFeePayment(amount, adminMtn, adminAirtel, method='mtn') {
  // In LIVE: call supabase.functions.invoke('momo-collect', {amount, payee: adminMtn/Airtel})
  console.log(`[PAYMENT] Registration fee ${amount} UGX -> Admin ${method} ${method==='mtn'? adminMtn : adminAirtel}`);
  // Simulate MTN MoMo API success
  await new Promise(r=>setTimeout(r,1200));
  const txnId = 'REG-'+Date.now();
  // Record transaction in Supabase
  try {
    await supabaseClient.from('transactions').insert({
      type:'registration_fee',
      amount_total: amount,
      amount_admin: amount,
      provider: method,
      status:'completed',
      mtn_txn_id: txnId
    });
  } catch(e){}
  return {success:true, txnId};
}

async function processTicketPayment(bookingData, company, adminSettings) {
  // bookingData contains finalPrice but we split behind scenes
  const pricing = calculateFinalTicketPrice(bookingData.base_price, adminSettings.commission_percent, adminSettings.mtn_fee_percent);
  console.log(`[DISBURSEMENT] Customer pays ${pricing.finalPrice} -> Company ${pricing.basePrice} to ${company.mtn_code || company.airtel_code}, Admin ${pricing.adminCommission} to ${adminSettings.admin_mtn_code}, Fee ${pricing.providerFee}`);
  await new Promise(r=>setTimeout(r,800));
  try {
    await supabaseClient.from('transactions').insert({
      type:'ticket_sale',
      amount_total: pricing.finalPrice,
      amount_company: pricing.basePrice,
      amount_admin: pricing.adminCommission,
      amount_provider_fee: pricing.providerFee,
      to_company_id: company.id,
      booking_id: bookingData.id,
      provider: bookingData.payment_method || 'mtn',
      status:'completed'
    });
    await supabaseClient.from('earnings_admin').insert({amount: pricing.adminCommission, commission_percent: adminSettings.commission_percent, company_id: company.id, booking_id: bookingData.id});
    await supabaseClient.from('earnings_company').insert({company_id: company.id, amount: pricing.basePrice, booking_id: bookingData.id});
  } catch(e){console.error(e)}
  return {success:true, pricing};
}

// Sync indicator
function updateSyncStatus(online){return;} // hidden badge
function _old_updateSyncStatus(online) {
  const el = document.getElementById('syncStatus');
  if(!el) return;
  if(online) { el.textContent='● 
  else { el.textContent='● OFFLINE - Using local'; el.style.background='#ef4444'; }
}

(async () => {
  await fetchPlatformSettings();
  updateSyncStatus(true);
  // Realtime subscriptions for linked apps
  supabaseClient.channel('daily-travel-sync')
    .on('postgres_changes', {event:'*', schema:'public', table:'companies'}, payload=>{ console.log('Company change', payload); if(window.DB) { location.reload(); } })
    .on('postgres_changes', {event:'*', schema:'public', table:'seat_blocks'}, payload=>{ console.log('Seat block', payload); if(window.render) render(); })
    .on('postgres_changes', {event:'*', schema:'public', table:'bookings'}, payload=>{ if(window.render) render(); })
    .on('postgres_changes', {event:'*', schema:'public', table:'platform_settings'}, payload=>{ fetchPlatformSettings(); })
    .subscribe();
})();
</script>

.grid{display:grid;gap:12px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px}.small{font-size:12px;color:#64748b}label{font-size:13px;font-weight:600;margin:10px 0 6px;display:block}
.seat{width:42px;height:42px;border-radius:12px;border:1px solid var(--border);display:grid;place-items:center;font-size:13px;font-weight:700;cursor:pointer;background:#fff}.seat.taken{background:#0798E3;color:#fff}.seat.staff{background:#fffbeb;border-color:#fbbf24}.seat.selected{background:#62C9C5;color:#fff}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;z-index:9999}
.hero{background:linear-gradient(135deg,#0798E3 0%, #62C9C5 100%);color:#fff;padding:18px;border-radius:20px;display:flex;gap:16px;align-items:center}
.passWrap{position:relative;display:flex}.passWrap .input{border-radius:12px 0 0 12px;flex:1}.passWrap .eyeBtn{border-radius:0 12px 12px 0;border:1px solid var(--border);border-left:0;background:#fff;padding:0 14px;cursor:pointer}

/* MOBILE LOGIN FIX - added per request, keeps original design */

  .hero, .grid-3, .app{grid-template-columns:1fr!important;flex-direction:column!important}

  .input, select, button{font-size:16px!important;min-height:44px}

  .main{width:100%!important}

}

  #authBox{max-width:560px}
}
/* Ensure login works on touch and mouse */
.input{touch-action:manipulation}

 if(companyTab==='overview'){return `<div class="grid grid-3"><div class="kpi"><h3>${routes.length}</h3><p>Routes</p></div><div class="kpi"><h3>${buses.length}</h3><p>Buses</p></div><div class="kpi"><h3>${bookings.length}</h3><p>Bookings</p></div></div><div class="grid grid-3" style="margin-top:12px"><div class="kpi"><h3>${money(daily)}</h3><p>Daily — persists</p></div><div class="kpi"><h3>${money(weekly)}</h3><p>Weekly</p></div><div class="kpi"><h3>${money(monthly)}</h3><p>Monthly</p></div></div>`}
 if(companyTab==='routes'){return `<div class="card"><b>Add Routes under Branches with Ticket Prices — Company sets times via Schedules</b><div class="grid grid-2" style="margin-top:12px"><div><label>Branch</label><select id="r_branch" class="input">${branches.map(b=>`<option value="${b.id}">${b.name}</option>`).join('')}</select><label>Origin</label><input id="r_origin" class="input"/><label>Destination</label><input id="r_dest" class="input"/><label>Ticket Price Base</label><input id="r_price" type="number" class="input"/><button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="addRoute()">Add Route</button></div><div><b>Routes</b><div class="grid" style="margin-top:8px">${routes.map(r=>`<div class="card"><b>${r.origin}→${r.destination}</b><div class="small">${money(r.price)} • ${DB.branches.find(b=>b.id===r.branchId)?.name}</div></div>`).join('')||'No routes'}</div></div></div></div>`}
 if(companyTab==='buses'){return `<div class="card"><b>Add Buses with Capacity, Seat Numbers, Mark Staff Seats — Blue taken both sides</b><div class="grid grid-2"><div><label>Branch</label><select id="b_branch" class="input">${branches.map(b=>`<option value="${b.id}">${b.name}</option>`).join('')}</select><label>Name/Plate</label><input id="b_name" class="input"/><label>Capacity</label><input id="b_cap" type="number" class="input" value="40"/><label>Staff Seats</label><input id="b_staff" class="input"/><button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="addBus()">Add Bus</button></div><div><b>Buses</b>${buses.map(b=>`<div class="card" style="margin-top:8px"><b>${b.name} — ${b.capacity}</b><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${Array.from({length:b.capacity},(_,i)=>{const n=i+1; const st=(b.staffSeats||[]).includes(n); return `<span class="seat ${st?'staff':''}">${n}${st?'*':''}</span>`}).join('')}</div></div>`).join('')||'No buses'}</div></div></div>`}
 if(companyTab==='schedules'){return `<div class="card"><b>Add Departure Times alongside Routes and Ticket Prices — Future only, time system</b><div class="grid grid-2"><div><label>Route</label><select id="s_route" class="input">${routes.map(r=>`<option value="${r.id}">${r.origin}→${r.destination} — ${money(r.price)}</option>`).join('')}</select><label>Bus</label><select id="s_bus" class="input">${buses.map(b=>`<option value="${b.id}">${b.name}</option>`).join('')}</select><label>Departure</label><input id="s_dep" type="datetime-local" class="input"/><button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="addSchedule()">Add Schedule</button></div><div><b>Schedules</b>${DB.schedules.filter(s=>routes.some(r=>r.id===s.routeId)).sort((a,b)=>a.departure-b.departure).map(s=>{const r=DB.routes.find(x=>x.id===s.routeId); const b=DB.buses.find(x=>x.id===s.busId); const taken=DB.bookings.filter(bk=>bk.scheduleId===s.id).map(bk=>bk.seatNumber); const past=s.departure<Date.now(); return `<div class="card" style="margin-top:8px;${past?'opacity:.5':''}"><b>${r?.origin}→${r?.destination} • ${b?.name} ${past?'(Past — hidden for customers)':''}</b><div class="small">${new Date(s.departure).toLocaleString()} • Taken blue: ${taken.join(',')||'none'}</div><div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px">${Array.from({length:b?.capacity||0},(_,i)=>{const n=i+1; return `<span class="seat ${taken.includes(n)?'taken':''}">${n}</span>`}).join('')}</div></div>`}).join('')||'No schedules'}</div></div></div>`}
 if(companyTab==='bookings'){return `<div class="card"><b>Bookings — Full account — Blue taken both sides — Persists</b><table style="width:100%;font-size:13px"><tr><th>Customer</th><th>Route</th><th>Seat</th><th>Price</th><th>Date</th></tr>${bookings.map(b=>{const r=DB.routes.find(x=>x.id===b.routeId); const cust=DB.users.find(u=>u.id===b.customerId); return `<tr><td>${cust?.name}</td><td>${r?.origin}→${r?.destination}</td><td><span class="seat taken" style="display:inline-grid">${b.seatNumber}</span></td><td>${money(b.basePrice)}+${money(b.commissionAmount)}</td><td class="small">${new Date(b.createdAt).toLocaleString()}</td></tr>`}).join('')}</table></div>`}
 if(companyTab==='earnings'){return `<div class="grid grid-3"><div class="kpi"><h3>${money(daily)}</h3><p>Daily</p></div><div class="kpi"><h3>${money(weekly)}</h3><p>Weekly</p></div><div class="kpi"><h3>${money(monthly)}</h3><p>Monthly — persists</p></div></div><div class="card" style="margin-top:12px"><table style="width:100%"><tr><th>Date</th><th>Amount</th></tr>${DB.earningsCompany.filter(e=>e.companyId===comp.id).slice(-100).reverse().map(e=>`<tr><td class="small">${new Date(e.date).toLocaleString()}</td><td>${money(e.amount)}</td></tr>`).join('')}</table></div>`}
 if(companyTab==='notifications'){return `<div class="grid grid-2"><div class="card"><b>Send General/Individual to Customers — Full account</b><label>Type</label><select id="cn_type" class="input"><option value="general">General to all customers</option><option value="individual">Individual</option></select><div id="cn_ind" style="display:none"><label>Email</label><input id="cn_email" class="input"/></div><label>Title</label><input id="cn_title" class="input"/><label>Message</label><textarea id="cn_body" class="input"></textarea><button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="sendCompanyNotif()">Send</button></div><div class="card"><b>Messages from Admin / Purchases</b>${notifs.map(n=>`<div class="card" style="margin-top:8px"><b>${n.title}</b><div class="small">${new Date(n.createdAt).toLocaleString()}</div><div>${n.body}</div></div>`).join('')||'No notifications'}</div></div>`}
 if(companyTab==='settings'){return `<div class="grid grid-2"><div class="card"><b>Settings — PNG/JPG only, Password Eye</b><label>Company Name</label><input id="cs_name" class="input" value="${comp.name}"/><label>Logo URL PNG/JPG</label><input id="cs_logo" class="input" value="${comp.logo||''}"/><label>MTN Code</label><input id="cs_mtn" class="input" value="${comp.mtnCode||''}"/><label>Airtel Code</label><input id="cs_airtel" class="input" value="${comp.airtelCode||''}"/><label>Bank Name</label><input id="cs_bankname" class="input" value="${comp.bank?.name||''}"/><label>Account</label><input id="cs_bankacc" class="input" value="${comp.bank?.account||''}"/><label>Bank</label><input id="cs_bankbank" class="input" value="${comp.bank?.bank||''}"/><label>Password</label><div class="passWrap"><input id="cs_pass" type="password" class="input" value="${comp.password}"/><button type="button" class="eyeBtn" onclick="eye('cs_pass')">👁</button></div><button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="saveCompanySettings()">Save — Persists</button></div><div class="card"><b>Branch Manager Contact (PDF receipt)</b>${branches.map(b=>`<div class="card" style="margin-top:8px"><b>${b.name}</b><label>Location</label><input id="br_loc_${b.id}" class="input" value="${b.location}"/><label>Manager Contact</label><input id="br_man_${b.id}" class="input" value="${b.managerContact}"/><button class="btn btn-ghost" style="margin-top:6px;width:100%" onclick="saveBranch('${b.id}')">Save Branch</button></div>`).join('')}</div></div>`}
 return '';
}
window.addRoute=()=>{DB=loadDB(); const branchId=document.getElementById('r_branch').value, o=document.getElementById('r_origin').value.trim(), d=document.getElementById('r_dest').value.trim(), p=parseFloat(document.getElementById('r_price').value); if(!o||!d||!p){toast('Fill'); return} DB.routes.push({id:uid(),companyId:SESSION.companyId,branchId,origin:o,destination:d,price:p,createdAt:Date.now()}); saveDB(DB); toast('Route added'); render();};
window.addBus=()=>{DB=loadDB(); const branchId=document.getElementById('b_branch').value, name=document.getElementById('b_name').value.trim(), cap=parseInt(document.getElementById('b_cap').value), staff=document.getElementById('b_staff').value.split(',').map(s=>parseInt(s.trim())).filter(n=>!isNaN(n)); if(!name||!cap){toast('Fill'); return} DB.buses.push({id:uid(),companyId:SESSION.companyId,branchId,name,plate:name,capacity:cap,staffSeats:staff,createdAt:Date.now()}); saveDB(DB); toast('Bus added'); render();};
window.addSchedule=()=>{DB=loadDB(); const routeId=document.getElementById('s_route').value, busId=document.getElementById('s_bus').value, dep=document.getElementById('s_dep').value; if(!dep){toast('Pick date'); return} const t=new Date(dep).getTime(); if(t<Date.now()){toast('Must be future — time system'); return} DB.schedules.push({id:uid(),routeId,busId,departure:t,createdAt:Date.now()}); saveDB(DB); toast('Schedule added — future'); render();};
window.saveCompanySettings=()=>{DB=loadDB(); const c=DB.companies.find(x=>x.id===SESSION.companyId); const logo=document.getElementById('cs_logo').value.trim(); if(logo && !/\.(png|jpg|jpeg)$/i.test(logo)){toast('PNG/JPG only'); return} c.name=document.getElementById('cs_name').value.trim(); c.logo=logo; c.mtnCode=document.getElementById('cs_mtn').value.trim(); c.airtelCode=document.getElementById('cs_airtel').value.trim(); c.bank={name:document.getElementById('cs_bankname').value.trim(),account:document.getElementById('cs_bankacc').value.trim(),bank:document.getElementById('cs_bankbank').value.trim()}; c.password=document.getElementById('cs_pass').value; saveDB(DB); toast('Saved'); render();};
window.saveBranch=(id)=>{DB=loadDB(); const b=DB.branches.find(x=>x.id===id); b.location=document.getElementById('br_loc_'+id).value.trim(); b.managerContact=document.getElementById('br_man_'+id).value.trim(); saveDB(DB); toast('Branch saved');};
window.sendCompanyNotif=()=>{const type=document.getElementById('cn_type').value, title=document.getElementById('cn_title').value.trim(), body=document.getElementById('cn_body').value.trim(); if(!title||!body){toast('Fill'); return} DB=loadDB(); if(type==='general'){DB.users.filter(u=>u.role==='customer').forEach(u=>{DB.notifications.push({id:uid(),toUserId:u.id,toRole:'customer',title,body,read:false,createdAt:Date.now(),fromCompanyId:SESSION.companyId})});} else {const email=document.getElementById('cn_email').value.trim(); const user=DB.users.find(u=>u.email===email); if(!user){toast('Not found'); return} DB.notifications.push({id:uid(),toUserId:user.id,toRole:'customer',title,body,read:false,createdAt:Date.now(),fromCompanyId:SESSION.companyId});} saveDB(DB); toast('Sent'); render();};
window.updateAvatar=()=>{const file=document.getElementById('up_av').files[0]; if(!file){toast('Pick file'); return} if(!['image/jpeg','image/png','image/jpg'].includes(file.type)){toast('JPG/PNG only'); return} const r=new FileReader(); r.onload=()=>{DB=loadDB(); const u=DB.users.find(x=>x.id===SESSION.userId); u.avatar=r.result; saveDB(DB); toast('Avatar updated'); render();}; r.readAsDataURL(file);};
window.sendRecovery=()=>{const contact=document.getElementById('rec_c').value.trim(); if(!contact){toast('Enter'); return} const code=Math.floor(100000+Math.random()*900000); const box=document.getElementById('recBox'); box.innerHTML=`<div class="card" style="margin-top:10px"><b>Code ${code} sent to ${contact} (demo)</b><label>Code</label><input id="rec_code" class="input"/><label>New Password</label><div class="passWrap"><input id="rec_new" type="password" class="input"/><button type="button" class="eyeBtn" onclick="eye('rec_new')">👁</button></div><button class="btn btn-primary" style="margin-top:8px;width:100%" onclick="verifyRecovery(${ '${code}' })">Verify</button></div>`; toast(`Code ${code}`);};
window.verifyRecovery=(real)=>{const ent=document.getElementById('rec_code').value.trim(), np=document.getElementById('rec_new').value; if(ent!=real){toast('Invalid'); return} if(!np){toast('Enter new pass'); return} const contact=document.getElementById('rec_c').value.trim(); DB=loadDB(); let u=DB.users.find(x=>x.email===contact||x.phone===contact); let c=DB.companies.find(x=>x.email===contact||x.phone===contact); if(u) u.password=np; else if(c) c.password=np; else {toast('Not found'); return} saveDB(DB); toast('Password reset'); view='landing'; renderLanding(document.getElementById('root')); setTimeout(renderAuthBox,0);};
document.addEventListener('change',e=>{if(e.target.id==='cn_type'){const el=document.getElementById('cn_ind'); if(el) el.style.display=e.target.value==='individual'?'block':'none';}});

// LIVE SYNC POLL - ensures approved company immediately reflects on customer dashboard
let _lastTs = localStorage.getItem(LS_KEY+'_ts');
setInterval(()=>{
  const curTs = localStorage.getItem(LS_KEY+'_ts');
  if(curTs && curTs!==_lastTs){
    _lastTs=curTs;
    DB=loadDB();
    if(typeof render==='function' && SESSION){ render(); toast('Approved company now live — refresh done'); }
    if(typeof renderLanding==='function' && !SESSION){ renderLanding(document.getElementById('root')); }
  }
}, 2000);

window.addEventListener('storage',e=>{if(e.key===LS_KEY||e.key===LS_KEY+'_ts'){DB=loadDB(); if(SESSION){render(); toast('Linked data updated — Admin monitoring')}}});
(function(){DB=loadDB(); if(SESSION){view=SESSION.role;} renderLanding(document.getElementById('root')); setTimeout(renderAuthBox,0);})();
</script>
</body>
</html>
